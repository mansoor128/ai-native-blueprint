server:
  port: 8080

spring:
  application:
    name: favorites-api
  datasource:
    url: jdbc:h2:mem:favorites;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true

# Demo auth: frontend sends X-User-Id header (stand-in for Bearer token)
favorites:
  cors-allowed-origins: ${FAVORITES_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level requestId=%X{requestId} userId=%X{userId} - %msg%n"
