services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: favorites
      POSTGRES_USER: favorites
      POSTGRES_PASSWORD: favorites
    ports:
      - "5432:5432"
    volumes:
      - favorites_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U favorites -d favorites"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/favorites
      SPRING_DATASOURCE_USERNAME: favorites
      SPRING_DATASOURCE_PASSWORD: favorites
      FAVORITES_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  favorites_pg:
