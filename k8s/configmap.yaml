apiVersion: v1
kind: ConfigMap
metadata:
  name: favorites-backend-config
  namespace: favorites
  labels:
    app: favorites-backend
data:
  SPRING_PROFILES_ACTIVE: "postgres"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://favorites-db:5432/favorites"
  SPRING_DATASOURCE_USERNAME: "favorites"
  FAVORITES_CORS_ALLOWED_ORIGINS: "https://favorites.example.com,http://localhost:3000"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: favorites-frontend-nginx
  namespace: favorites
  labels:
    app: favorites-frontend
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://favorites-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
