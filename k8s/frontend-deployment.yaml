apiVersion: apps/v1
kind: Deployment
metadata:
  name: favorites-frontend
  namespace: favorites
  labels:
    app: favorites-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: favorites-frontend
  template:
    metadata:
      labels:
        app: favorites-frontend
    spec:
      containers:
        - name: favorites-frontend
          # Replace ACCOUNT_ID / tag after CI pushes to ECR
          image: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/ai-native-favorites-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: favorites-frontend-nginx
