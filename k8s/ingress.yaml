apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: favorites
  namespace: favorites
  labels:
    app.kubernetes.io/name: favorites
  annotations:
    # Generic nginx ingress — swap for ALB annotations on EKS if needed
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    # Example AWS ALB (uncomment / adapt for EKS):
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: nginx
  rules:
    - host: favorites.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: favorites-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: favorites-frontend
                port:
                  number: 80
