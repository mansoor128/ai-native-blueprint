apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: favorites

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/ai-native-favorites-backend
    newTag: latest
  - name: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/ai-native-favorites-frontend
    newTag: latest
